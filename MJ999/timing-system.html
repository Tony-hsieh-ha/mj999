<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能計時收費系統 - 麻將館管理系統</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .timing-dashboard {
            display: grid;
            grid-template-columns: 1fr 2fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .table-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }

        .table-card {
            background: linear-gradient(135deg, #2a2a2a 0%, #1a1a1a 100%);
            border: 1px solid #3a3a3a;
            border-radius: 15px;
            padding: 20px;
            position: relative;
            transition: all 0.3s ease;
        }

        .table-card.occupied {
            border-color: #28a745;
            box-shadow: 0 0 20px rgba(40, 167, 69, 0.2);
        }

        .table-card.vacant {
            border-color: #6c757d;
        }

        .table-card.warning {
            border-color: #ffc107;
            box-shadow: 0 0 20px rgba(255, 193, 7, 0.2);
        }

        .table-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .table-number {
            font-size: 1.5rem;
            font-weight: bold;
            color: #ffd700;
        }

        .table-status {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
        }

        .status-occupied {
            background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
            color: white;
        }

        .status-vacant {
            background: linear-gradient(135deg, #6c757d 0%, #5a6268 100%);
            color: white;
        }

        .status-warning {
            background: linear-gradient(135deg, #ffc107 0%, #e0a800 100%);
            color: #000;
        }

        .timer-display {
            font-size: 2rem;
            font-weight: bold;
            text-align: center;
            color: #ffffff;
            margin: 15px 0;
            font-family: 'Courier New', monospace;
        }

        .customer-info {
            background: linear-gradient(135deg, #1a1a1a 0%, #0a0a0a 100%);
            border-radius: 10px;
            padding: 15px;
            margin: 15px 0;
        }

        .customer-name {
            color: #ffd700;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .customer-details {
            color: #cccccc;
            font-size: 0.9rem;
        }

        .table-controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 15px;
        }

        .control-btn {
            padding: 10px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-start {
            background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
            color: white;
        }

        .btn-stop {
            background: linear-gradient(135deg, #dc3545 0%, #c82333 100%);
            color: white;
        }

        .btn-extend {
            background: linear-gradient(135deg, #17a2b8 0%, #138496 100%);
            color: white;
        }

        .btn-service {
            background: linear-gradient(135deg, #6f42c1 0%, #5a32a3 100%);
            color: white;
        }

        .stats-card {
            background: linear-gradient(135deg, #2a2a2a 0%, #1a1a1a 100%);
            border: 1px solid #3a3a3a;
            border-radius: 15px;
            padding: 20px;
        }

        .stats-title {
            color: #ffd700;
            font-weight: bold;
            margin-bottom: 15px;
            font-size: 1.2rem;
        }

        .stat-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            padding: 10px;
            background: linear-gradient(135deg, #1a1a1a 0%, #0a0a0a 100%);
            border-radius: 8px;
        }

        .stat-label {
            color: #cccccc;
        }

        .stat-value {
            color: #ffd700;
            font-weight: bold;
        }

        .pricing-settings {
            background: linear-gradient(135deg, #2a2a2a 0%, #1a1a1a 100%);
            border: 1px solid #3a3a3a;
            border-radius: 15px;
            padding: 20px;
        }

        .pricing-group {
            margin-bottom: 15px;
        }

        .pricing-group label {
            display: block;
            color: #ffd700;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .pricing-group input {
            width: 100%;
            padding: 10px;
            background: linear-gradient(135deg, #1a1a1a 0%, #0a0a0a 100%);
            border: 1px solid #3a3a3a;
            border-radius: 8px;
            color: white;
        }

        .quick-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 15px;
        }

        .quick-action-btn {
            padding: 12px;
            background: linear-gradient(135deg, #3a3a3a 0%, #2a2a2a 100%);
            border: 1px solid #4a4a4a;
            border-radius: 8px;
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
        }

        .quick-action-btn:hover {
            background: linear-gradient(135deg, #4a4a4a 0%, #3a3a3a 100%);
            border-color: #ffd700;
        }

        .revenue-display {
            font-size: 1.5rem;
            color: #28a745;
            font-weight: bold;
            text-align: center;
            margin: 10px 0;
        }

        .session-history {
            max-height: 200px;
            overflow-y: auto;
            margin-top: 15px;
        }

        .history-item {
            background: linear-gradient(135deg, #1a1a1a 0%, #0a0a0a 100%);
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 8px;
            font-size: 0.9rem;
        }

        .history-time {
            color: #888888;
        }

        .history-revenue {
            color: #28a745;
            font-weight: bold;
        }

        @media (max-width: 1200px) {
            .timing-dashboard {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 768px) {
            .table-grid {
                grid-template-columns: 1fr;
            }
            
            .table-controls {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1 class="title">⏱️ 智能計時收費系統</h1>
            <div class="nav-buttons">
                <button class="nav-btn" onclick="location.href='index.html'">報名系統</button>
                <button class="nav-btn active">計時收費</button>
                <button class="nav-btn" onclick="location.href='schedule.html'">排班管理</button>
                <button class="nav-btn" onclick="location.href='inventory.html'">庫存管理</button>
            </div>
        </header>

        <div class="timing-dashboard">
            <!-- 實時統計 -->
            <div class="stats-card">
                <h3 class="stats-title">📊 實時統計</h3>
                <div class="stat-item">
                    <span class="stat-label">使用中桌數</span>
                    <span class="stat-value" id="occupiedTables">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">空桌數量</span>
                    <span class="stat-value" id="vacantTables">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">使用率</span>
                    <span class="stat-value" id="occupancyRate">0%</span>
                </div>
                <div class="revenue-display" id="currentRevenue">
                    今日營收: $0
                </div>
                <div class="quick-actions">
                    <button class="quick-action-btn" onclick="timingSystem.generateReport()">
                        📈 生成報表
                    </button>
                    <button class="quick-action-btn" onclick="timingSystem.exportData()">
                        💾 匯出資料
                    </button>
                </div>
            </div>

            <!-- 桌子管理 -->
            <div>
                <h3 class="stats-title">🀄 桌子管理</h3>
                <div class="table-grid" id="tableGrid">
                    <!-- 動態生成桌子卡片 -->
                </div>
            </div>

            <!-- 收費設定 -->
            <div class="pricing-settings">
                <h3 class="stats-title">⚙️ 收費設定</h3>
                <div class="pricing-group">
                    <label>平日費率 (元/小時)</label>
                    <input type="number" id="weekdayRate" value="200">
                </div>
                <div class="pricing-group">
                    <label>假日費率 (元/小時)</label>
                    <input type="number" id="weekendRate" value="300">
                </div>
                <div class="pricing-group">
                    <label>深夜費率 (元/小時)</label>
                    <input type="number" id="nightRate" value="400">
                </div>
                <div class="pricing-group">
                    <label>最短計時 (分鐘)</label>
                    <input type="number" id="minTime" value="30">
                </div>
                <div class="pricing-group">
                    <label>自動提醒時間 (分鐘)</label>
                    <input type="number" id="reminderTime" value="60">
                </div>
                <button class="submit-btn" onclick="timingSystem.savePricingSettings()">
                    儲存設定
                </button>
            </div>
        </div>

        <!-- 歷史記錄 -->
        <div class="stats-card">
            <h3 class="stats-title">📝 今日營運記錄</h3>
            <div class="session-history" id="sessionHistory">
                <!-- 動態生成歷史記錄 -->
            </div>
        </div>
    </div>

    <div id="notification" class="notification"></div>

    <script src="timing-system.js"></script>
</body>
</html>
