<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>配對系統</title>
    <link rel="stylesheet" href="style.css">
    <script src="mock-api.js"></script>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1 class="title">  智能配對系統</h1>
            <div class="nav-buttons">
                <button id="playerView" class="nav-btn active">玩家報名</button>
                <button id="adminView" class="nav-btn">管理後台</button>
                <button class="nav-btn" onclick="location.href='https://mj999-2168.vercel.app/invite-system.html'">配對約局</button>
            </div>
        </header>

        <main>
            <!-- 玩家報名頁面 -->
            <section id="playerSection" class="section active">
                <div class="registration-card">
                    <h2 class="card-title">立即報名</h2>
                    
                    <!-- 用戶資訊顯示 -->
                    <div id="userProfile" class="user-profile" style="display: none;">
                        <div style="display: flex; align-items: center; gap: 15px; margin-bottom: 20px; padding: 15px; background: linear-gradient(135deg, #1a1a1a 0%, #0a0a0a 100%); border-radius: 10px;">
                            <img id="userAvatar" class="user-avatar-small" src="" alt="頭貼">
                            <div>
                                <div id="userName" style="color: #ffd700; font-weight: bold; margin-bottom: 5px;"></div>
                                <button id="logoutBtn" class="logout-btn" style="background: linear-gradient(135deg, #dc3545 0%, #c82333 100%); color: white; border: none; padding: 5px 10px; border-radius: 5px; font-size: 0.8rem; cursor: pointer;">登出</button>
                            </div>
                        </div>
                    </div>
                    
                    <div id="loginPrompt" class="login-prompt">
                        <p style="text-align: center; color: #cccccc; margin-bottom: 20px;">請先登入以使用報名功能</p>
                        <div style="text-align: center;">
                            <a href="https://mj999-2168.vercel.app/line-login.html" class="line-login-btn-small" style="display: inline-block; background: #06C755; color: white; padding: 12px 25px; border-radius: 8px; text-decoration: none; font-weight: bold; margin-bottom: 15px;">🟢 使用LINE登入</a>
                        </div>
                    </div>
                    
                    <form id="registrationForm" style="display: none;">
                        <div class="form-group" id="nicknameGroup" style="display: none;">
                            <label for="nickname">暱稱</label>
                            <input type="text" id="nickname" name="nickname" required placeholder="請輸入您的暱稱">
                        </div>
                        
                        <div class="form-group">
                            <label>選擇金額</label>
                            <div class="amount-options">
                                <label class="amount-option">
                                    <input type="radio" name="amount" value="30/10" required>
                                    <span class="amount-btn">$30/10</span>
                                </label>
                                <label class="amount-option">
                                    <input type="radio" name="amount" value="60/20" required>
                                    <span class="amount-btn">$60/20</span>
                                </label>
                                <label class="amount-option">
                                    <input type="radio" name="amount" value="100/20" required>
                                    <span class="amount-btn">$100/20</span>
                                </label>
                                <label class="amount-option">
                                    <input type="radio" name="amount" value="200/50" required>
                                    <span class="amount-btn">$200/50</span>
                                </label>
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <label>希望開打時間</label>
                            <div class="time-range-selector">
                                <div class="time-input-group">
                                    <label for="earliestTime">最早可開打時間</label>
                                    <select id="earliestTime" required>
                                        <!-- 動態生成時間選項 -->
                                    </select>
                                </div>
                                <div class="time-input-group">
                                    <label for="latestTime">最晚可開打時間</label>
                                    <select id="latestTime" required>
                                        <!-- 動態生成時間選項 -->
                                    </select>
                                </div>
                            </div>
                        </div>
                        
                        <button type="submit" class="submit-btn">確認報名</button>
                    </form>
                </div>

                <div class="current-registrations">
                    <h3>目前報名狀況</h3>
                    
                    <!-- 金額統計 -->
                    <div class="amount-stats">
                        <div class="stat-row">
                            <span class="amount-label">30/10:</span>
                            <span class="amount-count" id="count-30-10">0人</span>
                        </div>
                        <div class="stat-row">
                            <span class="amount-label">60/20:</span>
                            <span class="amount-count" id="count-60-20">0人</span>
                        </div>
                        <div class="stat-row">
                            <span class="amount-label">100/20:</span>
                            <span class="amount-count" id="count-100-20">0人</span>
                        </div>
                        <div class="stat-row">
                            <span class="amount-label">200/50:</span>
                            <span class="amount-count" id="count-200-50">0人</span>
                        </div>
                    </div>
                    
                    <div id="registrationList" class="registration-list">
                        <!-- 動態生成報名列表 -->
                    </div>
                </div>
            </section>

            <!-- 管理後台頁面 -->
            <section id="adminSection" class="section">
                <div class="admin-card">
                    <h2 class="card-title">管理後台</h2>
                    
                    <div class="admin-stats">
                        <div class="stat-item">
                            <span class="stat-label">總報名人數</span>
                            <span id="totalCount" class="stat-value">0</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-label">待開桌</span>
                            <span id="pendingCount" class="stat-value">0</span>
                        </div>
                    </div>

                    <div class="admin-controls">
                        <button id="createTable" class="admin-btn">手動配對</button>
                        <button id="clearAll" class="admin-btn danger">清空所有報名</button>
                        <button id="lineNotifySettings" class="admin-btn settings">LINE Notify 設定</button>
                    </div>

                    <div class="registrations-management">
                        <h3>配對名單管理</h3>
                        <div id="adminRegistrationList" class="admin-registration-list">
                            <!-- 動態生成管理列表 -->
                        </div>
                    </div>
                </div>
            </section>
        </main>

        <!-- 通知區域 -->
        <div id="notification" class="notification"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
